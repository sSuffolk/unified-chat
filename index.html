<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
<title>Ultimate Stream Dashboard</title>
<style>
  /* --- BASE STYLES --- */
  * { box-sizing: border-box; }
  
  html, body { 
    margin: 0; 
    padding: 0; 
    height: 100dvh; 
    width: 100vw;
    background-color: #000000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-overflow-scrolling: touch;
  }
  
  .container {
    display: flex;
    flex-direction: column;
    width: 100%; 
    height: 100%;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    position: relative;
  }

  iframe { 
    width: 100%; 
    height: 100%; 
    border: none; 
    display: block;
    background: transparent;
  }

  /* --- PULL TO REFRESH --- */
  .ptr-indicator {
    position: absolute;
    top: env(safe-area-inset-top);
    left: 50%;
    transform: translateX(-50%) translateY(-60px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 20px;
    background: rgba(30, 30, 30, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: transform 0.3s ease, opacity 0.3s ease;
    pointer-events: none;
  }

  .ptr-indicator.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(12px);
  }

  .ptr-indicator.refreshing {
    transform: translateX(-50%) translateY(12px);
  }

  .ptr-spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #00ff88;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
  }

  .ptr-indicator.refreshing .ptr-spinner {
    display: block;
  }

  .ptr-indicator.refreshing .ptr-arrow {
    display: none;
  }

  .ptr-arrow {
    font-size: 16px;
    transition: transform 0.2s ease;
  }

  .ptr-indicator.ready .ptr-arrow {
    transform: rotate(180deg);
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* --- LABELS --- */
  .label {
    position: absolute; 
    left: 12px; 
    top: 12px;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px); 
    -webkit-backdrop-filter: blur(10px);
    color: #fff; 
    padding: 5px 12px; 
    border-radius: 14px;
    font-size: 11px; 
    font-weight: 700; 
    letter-spacing: 0.5px;
    border: 1px solid rgba(255,255,255,0.12);
    pointer-events: none; 
    z-index: 10;
    display: flex; 
    align-items: center; 
    gap: 6px;
  }

  .dot { 
    height: 6px; 
    width: 6px; 
    background-color: #00ff88; 
    border-radius: 50%; 
    box-shadow: 0 0 6px #00ff88;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 6px #00ff88; }
    50% { opacity: 0.6; box-shadow: 0 0 10px #00ff88; }
  }

  /* --- SECTIONS --- */
  .chat-section {
    flex: 65; 
    position: relative;
    background: #0a0a0a;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    min-height: 0;
  }
  
  .activity-section {
    flex: 35;
    position: relative;
    background: #000;
    min-height: 0;
  }

  .activity-frame {
    position: absolute;
    top: 0; 
    left: 0;
    width: 100%; 
    height: 100%;
  }

  /* --- ALERTS OVERLAY --- */
  .alerts-layer {
    position: absolute;
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%;
    pointer-events: none;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .alerts-layer iframe {
    transform: scale(0.55); 
    transform-origin: center center;
    width: 100%;
    height: 100%;
  }

  /* --- LANDSCAPE MODE --- */
  @media (orientation: landscape) {
    .container { 
      flex-direction: row; 
    }
    
    .chat-section {
      flex: 68; 
      border-bottom: none;
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    
    .activity-section { 
      flex: 32; 
    }

    .alerts-layer iframe {
      transform: scale(0.5);
    }
  }

  /* --- LOADING STATE --- */
  .section-loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    font-weight: 500;
    z-index: 5;
  }

  /* --- LARGE PHONES (iPhone Pro Max, etc) --- */
  @media (min-height: 800px) and (orientation: portrait) {
    .chat-section { flex: 62; }
    .activity-section { flex: 38; }
  }

  /* --- SMALL PHONES --- */
  @media (max-height: 700px) and (orientation: portrait) {
    .chat-section { flex: 70; }
    .activity-section { flex: 30; }
    .label { font-size: 10px; padding: 4px 10px; }
  }
</style>
</head>
<body>

  <!-- PULL TO REFRESH INDICATOR -->
  <div class="ptr-indicator" id="ptrIndicator">
    <span class="ptr-arrow">↓</span>
    <div class="ptr-spinner"></div>
    <span class="ptr-text">Pull to refresh</span>
  </div>

  <div class="container" id="mainContainer">

    <!-- ALERTS OVERLAY -->
    <div class="alerts-layer">
      <iframe 
        id="alertsFrame"
        src="https://botrix.live/widgets/alerts/?bid=bVvmmN942GtNeeUg3AWhJg" 
        allow="autoplay; fullscreen"
        loading="lazy"
      ></iframe>
    </div>

    <!-- CHAT (Botrix Combined) -->
    <div class="chat-section">
      <div class="label"><div class="dot"></div> CHAT</div>
      <iframe 
        id="chatFrame"
        src="https://botrix.live/widgets/chat/?bid=bVvmmN942GtNeeUg3AWhJg&bots=false&emojis=true&hideCommands=false&hideMessages=false&hideMessagesSeconds=10&widgetSize=21&trovo=false&twitch=true&youtube=true&kick=true&platformIcon=true&theme=default&ignoredUsers=&streamTogether=true&cheer=true&pointsReward=false&animation=none&showTimestamp=false&shadowThickness=1" 
        allow="autoplay; fullscreen"
      ></iframe>
    </div>

    <!-- ACTIVITY FEED -->
    <div class="activity-section">
      <div class="label"><div class="dot"></div> ACTIVITY</div>
      <div class="activity-frame">
        <iframe 
          id="activityFrame"
          src="https://botrix.live/widgets/activityfeed/?bid=bVvmmN942GtNeeUg3AWhJg" 
          allow="autoplay; fullscreen"
        ></iframe>
      </div>
    </div>

  </div>

  <script>
    /* ===== WAKE LOCK ===== */
    let wakeLock = null;
    
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try { 
          wakeLock = await navigator.wakeLock.request('screen'); 
        } catch (e) {
          console.log('Wake lock not available');
        }
      }
    }
    
    requestWakeLock();
    
    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    /* ===== PULL TO REFRESH ===== */
    const ptrIndicator = document.getElementById('ptrIndicator');
    const ptrText = ptrIndicator.querySelector('.ptr-text');
    const container = document.getElementById('mainContainer');
    
    let touchStartY = 0;
    let touchCurrentY = 0;
    let isPulling = false;
    let isRefreshing = false;
    const pullThreshold = 80;
    const maxPull = 120;

    container.addEventListener('touchstart', (e) => {
      if (isRefreshing) return;
      touchStartY = e.touches[0].clientY;
      isPulling = true;
    }, { passive: true });

    container.addEventListener('touchmove', (e) => {
      if (!isPulling || isRefreshing) return;
      
      touchCurrentY = e.touches[0].clientY;
      const pullDistance = touchCurrentY - touchStartY;
      
      if (pullDistance > 0 && pullDistance < maxPull) {
        const progress = Math.min(pullDistance / pullThreshold, 1);
        
        ptrIndicator.classList.add('visible');
        ptrIndicator.style.transform = `translateX(-50%) translateY(${12 + (pullDistance * 0.3)}px)`;
        
        if (pullDistance >= pullThreshold) {
          ptrIndicator.classList.add('ready');
          ptrText.textContent = 'Release to refresh';
        } else {
          ptrIndicator.classList.remove('ready');
          ptrText.textContent = 'Pull to refresh';
        }
      }
    }, { passive: true });

    container.addEventListener('touchend', () => {
      if (!isPulling || isRefreshing) return;
      
      const pullDistance = touchCurrentY - touchStartY;
      
      if (pullDistance >= pullThreshold) {
        triggerRefresh();
      } else {
        resetPullIndicator();
      }
      
      isPulling = false;
      touchStartY = 0;
      touchCurrentY = 0;
    }, { passive: true });

    function triggerRefresh() {
      isRefreshing = true;
      ptrIndicator.classList.remove('ready');
      ptrIndicator.classList.add('refreshing');
      ptrIndicator.style.transform = 'translateX(-50%) translateY(12px)';
      ptrText.textContent = 'Refreshing...';
      
      // Refresh all iframes
      refreshAllWidgets();
      
      // Reset after delay
      setTimeout(() => {
        ptrText.textContent = 'Done!';
        setTimeout(() => {
          resetPullIndicator();
          isRefreshing = false;
        }, 500);
      }, 1500);
    }

    function resetPullIndicator() {
      ptrIndicator.classList.remove('visible', 'ready', 'refreshing');
      ptrIndicator.style.transform = 'translateX(-50%) translateY(-60px)';
      ptrText.textContent = 'Pull to refresh';
    }

    function refreshAllWidgets() {
      const iframes = ['chatFrame', 'activityFrame', 'alertsFrame'];
      
      iframes.forEach(id => {
        const iframe = document.getElementById(id);
        if (iframe) {
          const src = iframe.src;
          iframe.src = '';
          setTimeout(() => {
            iframe.src = src;
          }, 100);
        }
      });
    }

    /* ===== PREVENT BOUNCE/OVERSCROLL ===== */
    document.body.addEventListener('touchmove', (e) => {
      if (e.target.closest('iframe')) return;
      // Allow pull-to-refresh zone
      if (isPulling) return;
      e.preventDefault();
    }, { passive: false });

  </script>

</body>
</html>
